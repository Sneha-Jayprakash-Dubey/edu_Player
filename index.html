<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: black; overflow: hidden; }
        #player { width: 100vw; height: 100vh; }
        #doneBtn { position: absolute; bottom: 20px; right: 20px; padding: 12px 20px; background: #fff; border: none; border-radius: 25px; font-weight: bold; z-index: 10; }
    </style>
</head>
<body>
    <div id="player"></div>
    <button id="doneBtn" onclick="sendToAndroid()">Mark as Completed</button>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('v');

        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: videoId,
                playerVars: { 'autoplay': 1, 'modestbranding': 1, 'playsinline': 1 },
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        // --- BEHAVIOR ANALYTICS HEARTBEAT ---
        setInterval(function() {
            if (player && player.getCurrentTime && window.AndroidInterface) {
                const currentTime = player.getCurrentTime();
                const duration = player.getDuration();
                // Send real-time playback data to Kotlin
                window.AndroidInterface.updateAnalytics(currentTime, duration);
            }
        }, 5000); 

        function onPlayerStateChange(event) {
            if (event.data === 0) sendToAndroid(); // Auto-complete on end
        }

        function sendToAndroid() {
            if (window.AndroidInterface) window.AndroidInterface.onTaskComplete();
        }
    </script>
</body>
</html>
