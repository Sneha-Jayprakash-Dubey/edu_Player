<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: black; overflow: hidden; }
        #player { width: 100vw; height: 100vh; }
        /* Removed the #doneBtn CSS */
    </style>
</head>
<body>
    <div id="player"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('v');
        const startPos = urlParams.get('start') || 0;

        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                videoId: videoId,
                playerVars: { 
                    'autoplay': 1, 
                    'modestbranding': 1, 
                    'playsinline': 1,
                    'start': parseInt(startPos) 
                },
                events: { 'onStateChange': onPlayerStateChange }
            });
        }

        // --- ANALYTICS HEARTBEAT ---
        setInterval(function() {
            if (player && player.getCurrentTime && window.AndroidInterface) {
                window.AndroidInterface.updateAnalytics(player.getCurrentTime(), player.getDuration());
            }
        }, 5000); 

        function onPlayerStateChange(event) {
            // When video ends (state 0), tell Android to auto-complete
            if (event.data === 0 && window.AndroidInterface) {
                window.AndroidInterface.onTaskComplete();
            }
        }
    </script>
</body>
</html>
