<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        /* This ensures there is no white flash or weird spacing */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        #player { width: 100vw; height: 100vh; pointer-events: auto; }
    </style>
</head>
<body>
    <div id="player"></div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('v');
        const startPos = urlParams.get('start') || 0;

        // Load the YouTube Iframe Player API code asynchronously.
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            if (!videoId) {
                console.error("No Video ID provided in URL");
                return;
            }
            player = new YT.Player('player', {
                videoId: videoId,
                playerVars: { 
                    'autoplay': 1, 
                    'modestbranding': 1, 
                    'rel': 0,
                    'showinfo': 0,
                    'playsinline': 1,
                    'controls': 0, // Hide YouTube controls for the TikTok feel
                    'start': parseInt(startPos) 
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange,
                    'onError': onPlayerError
                }
            });
        }

        function onPlayerReady(event) {
            event.target.playVideo(); // Force play when ready
        }

        function onPlayerError(e) {
            console.error("YouTube Player Error: " + e.data);
        }

        // --- ANALYTICS HEARTBEAT ---
        setInterval(function() {
            if (player && player.getCurrentTime && window.AndroidInterface) {
                try {
                    window.AndroidInterface.updateAnalytics(player.getCurrentTime(), player.getDuration());
                } catch(err) {
                    console.error("Bridge Error", err);
                }
            }
        }, 5000); 

        function onPlayerStateChange(event) {
            if (event.data === YT.PlayerState.ENDED) {
                if (window.AndroidInterface) window.AndroidInterface.onTaskComplete();
            }
        }
    </script>
</body>
</html>
