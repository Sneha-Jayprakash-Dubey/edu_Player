<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>EduConnect Video Player</title>
    <style>
        /* Make the player take up the entire screen */
        body, html { 
            margin: 0; 
            padding: 0; 
            width: 100%; 
            height: 100%; 
            background-color: #000; 
            overflow: hidden; 
            font-family: sans-serif;
        }

        #player {
            width: 100vw;
            height: 100vh;
        }

        /* Styling the 'Done' button to look like a modern mobile app button */
        #doneBtn {
            position: absolute;
            bottom: 30px;
            right: 20px;
            padding: 12px 24px;
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 25px;
            font-weight: bold;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
            display: none; /* Hidden until video ends or starts */
            z-index: 10;
        }

        /* Simple loading spinner */
        #loader {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
        }
    </style>
</head>
<body>

    <div id="loader">Loading Video...</div>
    <div id="player"></div>
    <button id="doneBtn" onclick="sendToAndroid()">Mark as Completed</button>

    <script>
        // 1. Extract Video ID from URL (e.g., yoursite.com/?v=dQw4w9WgXcQ)
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('v') || 'dQw4w9WgXcQ'; // Default if none found

        // 2. Load YouTube IFrame API
        var tag = document.createElement('script');
        tag.src = "https://www.youtube.com/iframe_api";
        var firstScriptTag = document.getElementsByTagName('script')[0];
        firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);

        var player;
        function onYouTubeIframeAPIReady() {
            player = new YT.Player('player', {
                height: '100%',
                width: '100%',
                videoId: videoId,
                playerVars: {
                    'autoplay': 1,
                    'controls': 1,
                    'rel': 0,
                    'modestbranding': 1,
                    'playsinline': 1,
                    'origin': window.location.origin
                },
                events: {
                    'onReady': onPlayerReady,
                    'onStateChange': onPlayerStateChange
                }
            });
        }

        function onPlayerReady(event) {
            document.getElementById('loader').style.display = 'none';
            document.getElementById('doneBtn').style.display = 'block';
        }

        function onPlayerStateChange(event) {
            // YT.PlayerState.ENDED = 0
            if (event.data === 0) {
                // Optional: Auto-trigger completion when video finishes
                sendToAndroid();
            }
        }

        // 3. Communicate with Kotlin
        function sendToAndroid() {
            if (window.AndroidInterface) {
                // This 'onTaskComplete' must match the @JavascriptInterface in Kotlin
                window.AndroidInterface.onTaskComplete();
            } else {
                alert("Task logged! (Running in browser mode)");
            }
        }
    </script>
</body>
</html>
